[package]
name = "moya"
version = "0.1.6"
description = "Moya — one local-first assistant"
authors = ["Lefa Moffat"]
license = "MIT"
repository = "https://github.com/zimablue-io/moya"
edition = "2021"
rust-version = "1.77"

[lib]
name = "moya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["common", "android-static-stdcxx", "vulkan"] }

[target.'cfg(target_os = "ios")'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["common", "metal"] }
libc = "0.2"

[features]
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
