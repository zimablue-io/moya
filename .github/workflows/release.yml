name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Resolve tag and lock versions
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node --experimental-strip-types scripts/release-version.mjs)"
          fi
          VERSION="$(node --experimental-strip-types scripts/release-version.mjs --tag "${TAG}")"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build Mac DMG
        env:
          CI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm package:mac
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#DMGS[@]} -eq 0 ]]; then
            echo "package:mac wrote no .dmg under src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          STABLE="Moya_aarch64.dmg"
          cp "${DMGS[0]}" "${STABLE}"
          NOTES="Mac DMG for ${TAG}. Unsigned until Apple Developer ID secrets are set; Gatekeeper will warn (right-click → Open)."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${DMGS[@]}" "${STABLE}" --clobber
          else
            gh release create "${TAG}" --title "Moya ${VERSION}" --notes "${NOTES}" --latest "${DMGS[@]}" "${STABLE}"
          fi
