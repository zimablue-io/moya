name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve version and skip if the stable DMG is already published
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node --experimental-strip-types scripts/release-version.mjs)"
          fi
          VERSION="$(node --experimental-strip-types scripts/release-version.mjs --tag "${TAG}")"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "Moya_aarch64.dmg"; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "${TAG} already has Moya_aarch64.dmg"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "${TAG} needs a Mac build"
          fi

  macos:
    name: macos
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build Mac DMG
        env:
          CI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Empty GitHub secrets still export APPLE_CERTIFICATE="". Tauri then
          # runs `security import` and the bundle dies before any DMG exists.
          if [[ -z "${APPLE_CERTIFICATE:-}" ]] || ! printf '%s' "${APPLE_CERTIFICATE}" | base64 -d >/dev/null 2>&1; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "Apple signing cert is missing or not valid base64; building unsigned"
          fi
          pnpm package:mac
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#DMGS[@]} -eq 0 ]]; then
            echo "package:mac wrote no .dmg under src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          STABLE="Moya_aarch64.dmg"
          cp "${DMGS[0]}" "${STABLE}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          NOTES="Mac DMG for ${TAG}. Unsigned until Apple Developer ID secrets are set; Gatekeeper will warn (right-click → Open)."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${DMGS[@]}" "${STABLE}" --clobber
          else
            gh release create "${TAG}" --title "Moya ${VERSION}" --notes "${NOTES}" --latest "${DMGS[@]}" "${STABLE}"
          fi
