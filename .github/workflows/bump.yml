name: Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver increment (patch, minor, major) or a specific X.Y.Z
        required: true
        default: patch
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockstep bump
        id: bump
        run: node --experimental-strip-types scripts/bump-version.mjs "${{ inputs.bump }}"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ steps.bump.outputs.version }}
          delete-branch: true
          title: "chore: release v${{ steps.bump.outputs.version }}"
          commit-message: "chore: release v${{ steps.bump.outputs.version }}"
          body: |
            Lockstep bump `${{ steps.bump.outputs.previous }}` → `${{ steps.bump.outputs.version }}` via `pnpm bump ${{ inputs.bump }}`.

            Merge this PR. Release on `main` builds and publishes the Mac DMG for `v${{ steps.bump.outputs.version }}`.
